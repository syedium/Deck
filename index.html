    <!-- Core App Logic -->
    <script>
        let currentSlideIndex = 1;
        let isPlaying = false;
        let playInterval = null;
        let isSidebarCollapsed = false;
        let activeViewMode = 'slide'; // 'slide' or 'handout'
        let currentFilter = '';

        // DOM elements cache
        const dom = {
            slideList: document.getElementById('slideList'),
            slideCategory: document.getElementById('slideCategory'),
            slideTitle: document.getElementById('slideTitle'),
            slideSub: document.getElementById('slideSub'),
            slideContent: document.getElementById('slideContent'),
            slideIndexFooter: document.getElementById('slideIndexFooter'),
            slideCounter: document.getElementById('slideCounter'),
            progressBar: document.getElementById('progressBar'),
            btnPrev: document.getElementById('btnPrev'),
            btnNext: document.getElementById('btnNext'),
            btnNotes: document.getElementById('btnNotes'),
            btnPlay: document.getElementById('btnPlay'),
            btnFullscreen: document.getElementById('btnFullscreen'),
            playIcon: document.getElementById('playIcon'),
            sidebar: document.getElementById('sidebar'),
            sidebarToggle: document.getElementById('sidebarToggle'),
            sidebarToggleIcon: document.getElementById('sidebarToggleIcon'),
            stage: document.getElementById('stage'),
            deckContainer: document.getElementById('deckContainer'),
            handoutContainer: document.getElementById('handoutContainer'),
            modeSlide: document.getElementById('modeSlide'),
            modeHandout: document.getElementById('modeHandout'),
            notesPanel: document.getElementById('notesPanel'),
            notesContent: document.getElementById('notesContent'),
            closeNotes: document.getElementById('closeNotes'),
            slideSearch: document.getElementById('slideSearch'),
            clearSearch: document.getElementById('clearSearch'),
            searchResultsToast: document.getElementById('searchResultsToast'),
            searchResultText: document.getElementById('searchResultText'),
            resetSearchFilter: document.getElementById('resetSearchFilter')
        };

        // Initialize App
        function initApp() {
            renderSlideNavigation();
            renderHandoutView();
            goToSlide(1);
            setupEventHandlers();
            lucide.createIcons();
        }

        // Render Sidebar List
        function renderSlideNavigation() {
            dom.slideList.innerHTML = '';
            const filteredSlides = getFilteredSlides();
            
            SLIDE_DATA.forEach((slide) => {
                const isMatch = filteredSlides.some(fs => fs.index === slide.index);
                if (currentFilter && !isMatch) return;

                const link = document.createElement('button');
                link.className = `w-full text-left px-3 py-2 rounded text-xs transition-all flex items-start gap-2.5 ${slide.index === currentSlideIndex ? 'bg-brand-light text-brand-dark font-semibold border-l-2 border-brand-dark' : 'text-brand-charcoal hover:bg-gray-100'}`;
                link.dataset.index = slide.index;
                
                link.innerHTML = `
                    <span class="font-mono text-[10px] text-brand-muted mt-0.5">${String(slide.index).padStart(2, '0')}</span>
                    <div class="flex-1 truncate">
                        <p class="truncate leading-tight">${slide.title}</p>
                        <p class="text-[9px] text-brand-muted uppercase tracking-wider truncate">${slide.subCategory}</p>
                    </div>
                `;
                
                link.addEventListener('click', () => {
                    goToSlide(slide.index);
                    if (window.innerWidth < 768) {
                        toggleSidebar(true);
                    }
                });
                dom.slideList.appendChild(link);
            });
        }

        // Render Handout Mode
        function renderHandoutView() {
            dom.handoutContainer.innerHTML = '';
            SLIDE_DATA.forEach((slide) => {
                const card = document.createElement('div');
                card.className = "bg-white border border-gray-200 rounded-lg p-8 md:p-12 shadow-sm relative print-break flex flex-col justify-between h-[550px]";
                card.innerHTML = `
                    <div class="flex items-start justify-between border-b border-gray-100 pb-4 h-16 shrink-0">
                        <div>
                            <span class="text-[10px] tracking-widest uppercase font-semibold text-brand-muted">${slide.category} &bull; ${slide.subCategory}</span>
                            <h2 class="slide-title text-xl md:text-2xl font-bold text-brand-dark mt-0.5">${slide.title}</h2>
                        </div>
                        <div>
                            <span class="text-[10px] tracking-widest uppercase font-medium text-brand-dark bg-brand-light px-2.5 py-1 rounded">${slide.sub}</span>
                        </div>
                    </div>
                    <div class="flex-1 py-6 flex flex-col justify-center overflow-y-auto">
                        ${slide.content}
                    </div>
                    <div class="border-t border-gray-100 pt-4 flex items-center justify-between text-[10px] tracking-wider text-brand-muted shrink-0 mt-4">
                        <div class="font-medium">MAILORA STRATEGIC OPERATIONAL PORTFOLIO</div>
                        <div class="italic">Slide ${slide.index} of 21 &bull; Technical Document Copy</div>
                    </div>
                `;
                dom.handoutContainer.appendChild(card);
            });
        }

        // Get Filtered slides based on search term
        function getFilteredSlides() {
            if (!currentFilter) return SLIDE_DATA;
            const search = currentFilter.toLowerCase();
            return SLIDE_DATA.filter(slide => 
                slide.title.toLowerCase().includes(search) || 
                slide.category.toLowerCase().includes(search) || 
                slide.subCategory.toLowerCase().includes(search) || 
                slide.content.toLowerCase().includes(search) || 
                slide.notes.toLowerCase().includes(search)
            );
        }

        // Go to specific slide number
        function goToSlide(index) {
            if (index < 1 || index > SLIDE_DATA.length) return;
            currentSlideIndex = index;
            
            const slide = SLIDE_DATA.find(s => s.index === currentSlideIndex);
            
            // Fade-out transition
            dom.slideContent.style.opacity = 0;
            dom.slideContent.style.transform = "translateY(5px)";
            
            setTimeout(() => {
                dom.slideCategory.textContent = `${slide.category} \u2022 ${slide.subCategory}`;
                dom.slideTitle.textContent = slide.title;
                dom.slideSub.textContent = slide.sub;
                dom.slideContent.innerHTML = slide.content;
                dom.slideIndexFooter.textContent = `${String(slide.index).padStart(2, '0')} of 21`;
                dom.slideCounter.textContent = `${String(slide.index).padStart(2, '0')}/21`;
                dom.notesContent.innerHTML = slide.notes;
                
                // Track progress
                const percentage = ((currentSlideIndex - 1) / (SLIDE_DATA.length - 1)) * 100;
                dom.progressBar.style.width = `${percentage}%`;
                
                // Re-instantiate icons that were loaded dynamically
                lucide.createIcons();

                // Button state limits
                dom.btnPrev.disabled = currentSlideIndex === 1;
                dom.btnNext.disabled = currentSlideIndex === SLIDE_DATA.length;
                
                // Active highlight in sidebar
                Array.from(dom.slideList.children).forEach(btn => {
                    const idx = parseInt(btn.dataset.index);
                    if (idx === currentSlideIndex) {
                        btn.classList.add('bg-brand-light', 'text-brand-dark', 'font-semibold', 'border-l-2', 'border-brand-dark');
                        btn.classList.remove('text-brand-charcoal');
                    } else {
                        btn.classList.remove('bg-brand-light', 'text-brand-dark', 'font-semibold', 'border-l-2', 'border-brand-dark');
                        btn.classList.add('text-brand-charcoal');
                    }
                });

                // Fade-in transition
                dom.slideContent.style.opacity = 1;
                dom.slideContent.style.transform = "translateY(0px)";
            }, 150);
        }

        // Auto-play mechanism
        function togglePlay() {
            if (isPlaying) {
                clearInterval(playInterval);
                dom.playIcon.setAttribute('data-lucide', 'play');
                isPlaying = false;
            } else {
                isPlaying = true;
                dom.playIcon.setAttribute('data-lucide', 'pause');
                playInterval = setInterval(() => {
                    if (currentSlideIndex < SLIDE_DATA.length) {
                        goToSlide(currentSlideIndex + 1);
                    } else {
                        goToSlide(1);
                    }
                }, 5000); // 5 seconds interval
            }
            lucide.createIcons();
        }

        // Fullscreen Toggle
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                dom.stage.requestFullscreen().catch(err => {
                    console.error(`Error enabling fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Toggle Sidebar Navigation View
        function toggleSidebar(forceState) {
            isSidebarCollapsed = forceState !== undefined ? forceState : !isSidebarCollapsed;
            if (isSidebarCollapsed) {
                dom.sidebar.classList.add('w-0', '-translate-x-full');
                dom.sidebar.classList.remove('w-72');
                dom.sidebarToggleIcon.setAttribute('data-lucide', 'chevron-right');
            } else {
                dom.sidebar.classList.remove('w-0', '-translate-x-full');
                dom.sidebar.classList.add('w-72');
                dom.sidebarToggleIcon.setAttribute('data-lucide', 'chevron-left');
            }
            lucide.createIcons();
        }

        // Set View mode (Slide Deck vs Handout View)
        function setViewMode(mode) {
            activeViewMode = mode;
            if (mode === 'slide') {
                dom.deckContainer.classList.remove('hidden');
                dom.handoutContainer.classList.add('hidden');
                dom.modeSlide.classList.add('bg-white', 'shadow-sm', 'text-brand-dark');
                dom.modeSlide.classList.remove('text-brand-muted');
                dom.modeHandout.classList.remove('bg-white', 'shadow-sm', 'text-brand-dark');
                dom.modeHandout.classList.add('text-brand-muted');
                goToSlide(currentSlideIndex);
            } else {
                dom.deckContainer.classList.add('hidden');
                dom.handoutContainer.classList.remove('hidden');
                dom.modeHandout.classList.add('bg-white', 'shadow-sm', 'text-brand-dark');
                dom.modeHandout.classList.remove('text-brand-muted');
                dom.modeSlide.classList.remove('bg-white', 'shadow-sm', 'text-brand-dark');
                dom.modeSlide.classList.add('text-brand-muted');
                // Hide notes panel in handout mode
                dom.notesPanel.classList.add('hidden');
            }
        }

        // Filter / Search engine handler
        function handleSearch(val) {
            currentFilter = val;
            const matches = getFilteredSlides();
            
            if (val) {
                dom.clearSearch.classList.remove('hidden');
                dom.searchResultsToast.classList.remove('hidden');
                dom.searchResultText.textContent = `Found ${matches.length} matching slides`;
                
                // If there are matches, go to the first matched slide automatically
                if (matches.length > 0) {
                    const matchedCurrent = matches.find(m => m.index === currentSlideIndex);
                    if (!matchedCurrent) {
                        goToSlide(matches[0].index);
                    }
                }
            } else {
                dom.clearSearch.classList.add('hidden');
                dom.searchResultsToast.classList.add('hidden');
            }
            
            renderSlideNavigation();
        }

        // Set up event listeners
        function setupEventHandlers() {
            // Left / Right navigation buttons
            dom.btnPrev.addEventListener('click', () => goToSlide(currentSlideIndex - 1));
            dom.btnNext.addEventListener('click', () => goToSlide(currentSlideIndex + 1));
            
            // Sidebar trigger handles
            dom.sidebarToggle.addEventListener('click', () => toggleSidebar());
            
            // Presenter notes toggle
            dom.btnNotes.addEventListener('click', () => {
                dom.notesPanel.classList.toggle('hidden');
            });
            dom.closeNotes.addEventListener('click', () => {
                dom.notesPanel.classList.add('hidden');
            });

            // Action modes
            dom.btnPlay.addEventListener('click', togglePlay);
            dom.btnFullscreen.addEventListener('click', toggleFullscreen);

            // View modes trigger
            dom.modeSlide.addEventListener('click', () => setViewMode('slide'));
            dom.modeHandout.addEventListener('click', () => setViewMode('handout'));

            // Search Bar Input Event handlers
            dom.slideSearch.addEventListener('input', (e) => handleSearch(e.target.value));
            dom.clearSearch.addEventListener('click', () => {
                dom.slideSearch.value = '';
                handleSearch('');
            });
            dom.resetSearchFilter.addEventListener('click', () => {
                dom.slideSearch.value = '';
                handleSearch('');
            });

            // Keyboard Shortcuts Listeners
            document.addEventListener('keydown', (e) => {
                // Ignore key shortcuts if user is typing in the search bar
                if (document.activeElement === dom.slideSearch) {
                    if (e.key === 'Escape') {
                        dom.slideSearch.blur();
                    }
                    return;
                }

                switch (e.key) {
                    case 'ArrowLeft':
                    case 'PageUp':
                        if (activeViewMode === 'slide' && currentSlideIndex > 1) {
                            goToSlide(currentSlideIndex - 1);
                        }
                        break;
                    case 'ArrowRight':
                    case 'PageDown':
                    case ' ': // Spacebar
                        e.preventDefault(); // Stop spacebar scrolling stage
                        if (activeViewMode === 'slide' && currentSlideIndex < SLIDE_DATA.length) {
                            goToSlide(currentSlideIndex + 1);
                        }
                        break;
                    case 'f':
                    case 'F':
                        toggleFullscreen();
                        break;
                    case 'n':
                    case 'N':
                        if (activeViewMode === 'slide') {
                            dom.notesPanel.classList.toggle('hidden');
                        }
                        break;
                    case '/':
                        e.preventDefault();
                        dom.slideSearch.focus();
                        break;
                    case 'Escape':
                        if (isPlaying) togglePlay();
                        dom.notesPanel.classList.add('hidden');
                        break;
                }
            });

            // Touch Swipe Support for Mobile/Tablet users
            let touchStartX = 0;
            let touchEndX = 0;
            
            dom.deckContainer.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            dom.deckContainer.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });

            function handleSwipe() {
                const threshold = 50; // minimum distance for horizontal swipes
                if (touchEndX < touchStartX - threshold) {
                    // Swiped Left -> Next Slide
                    if (currentSlideIndex < SLIDE_DATA.length) {
                        goToSlide(currentSlideIndex + 1);
                    }
                }
                if (touchEndX > touchStartX + threshold) {
                    // Swiped Right -> Previous Slide
                    if (currentSlideIndex > 1) {
                        goToSlide(currentSlideIndex - 1);
                    }
                }
            }

            // Adjust sidebar on window resize automatically
            window.addEventListener('resize', () => {
                if (window.innerWidth < 1024 && !isSidebarCollapsed) {
                    toggleSidebar(true);
                }
            });
            
            // Set initial state based on window size
            if (window.innerWidth < 1024) {
                toggleSidebar(true);
            }
        }

        // Launch app on load
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
